<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="converter-box">
        <h2>Temperature Converter</h2>
        <p class="subtitle">Convert temperatures between Celsius, Fahrenheit & Kelvin</p>

        <div class="input-group">
            <label for="tempInput">Enter Temperature</label>
            <input type="number" id="tempInput" placeholder="e.g., 25" step="any">
        </div>

        <div class="input-group">
            <label for="unitSelect">Select Input Unit</label>
            <select id="unitSelect">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button id="convertBtn" class="btn">Convert</button>

        <!-- Error Notification -->
        <div id="errorBox" class="error-box"></div>

        <!-- Output Cards -->
        <div class="results-wrapper">
            <div class="result-row">
                <span class="label">Celsius:</span>
                <span id="celsiusVal" class="value">--</span>
            </div>
            <div class="result-row">
                <span class="label">Fahrenheit:</span>
                <span id="fahrenheitVal" class="value">--</span>
            </div>
            <div class="result-row">
                <span class="label">Kelvin:</span>
                <span id="kelvinVal" class="value">--</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
